embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  normalize: true
  batch_size: 32

chunking:
  chunk_size: 512
  chunk_overlap: 100
  splitter: "recursive"

vector_db:
  backend: "chroma"
  collection: "medical_kb"
  distance: "cosine"
  persist_dir: "data/chroma_db"

sources:
  guidelines:
    - who
    - cdc
    - nice
    - nih
  datasets:
    - pubmedqa
    - medqa
    - bioasq

trust_scores:
  who: 0.95
  cdc: 0.95
  nice: 0.93
  nih: 0.93
  pubmed: 0.80
  medqa: 0.85
