random_seed: 42
numpy_seed: 42
torch_seed: 42
transformers_seed: 42

experiment:
  test_size: 200
  calibration_size: 100
  n_bootstrap: 1000
  alpha: 0.05

aeb:
  initial_k: 3
  step_k: 3
  max_k: 15
  confidence_threshold: 0.80
  stop_on_budget_exhausted: true

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rerank_top_k: 15
  final_top_k: 10

verification:
  nli_model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  entailment_threshold: 0.7
  similarity_threshold: 0.75

calibration:
  method: "temperature_scaling"
  default_temperature: 1.0

llm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  serving_backend: "kaggle_fp16"
  load_in_4bit: false
  bnb_double_quant: false
  max_new_tokens: 512
  temperature: 0.1
  top_p: 0.95

embedding:
  model_name: "BAAI/bge-m3"
  chunk_size: 512
  chunk_overlap: 100
