random_seed: 42
numpy_seed: 42
torch_seed: 42
transformers_seed: 42

experiment:
  test_size: 200
  calibration_size: 100
  n_bootstrap: 1000
  alpha: 0.05

aeb:
  initial_k: 3
  step_k: 3
  max_k: 15
  confidence_threshold: 0.70
  stop_on_budget_exhausted: true

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rerank_top_k: 15
  final_top_k: 10

verification:
  nli_model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  entailment_threshold: 0.7
  similarity_threshold: 0.75

calibration:
  method: "temperature_scaling"
  default_temperature: 1.0

llm:
  # microsoft/Llama3-Med-8B-Instruct: medical-tuned, fits 6GB at 4-bit NF4
  model_name: "microsoft/Llama3-Med-8B-Instruct"
  serving_backend: "local_4bit"
  load_in_4bit: true
  bnb_double_quant: true
  max_new_tokens: 256
  temperature: 0.1
  top_p: 0.95

ragas_judge:
  # Use same model family for RAGAS judging
  model_name: "microsoft/Llama3-Med-8B-Instruct"


embedding:
  # bge-small-en-v1.5: 90 MB, 384-dim, runs fast on CPU — keeps VRAM free for
  # the LLM. Swap to BAAI/bge-m3 only if you need multilingual / long-context.
  model_name: "BAAI/bge-small-en-v1.5"
  chunk_size: 512
  chunk_overlap: 100
