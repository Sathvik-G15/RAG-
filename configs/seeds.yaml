random_seed: 42
numpy_seed: 42
torch_seed: 42
transformers_seed: 42

experiment:
  test_size: 200
  calibration_size: 100
  n_bootstrap: 1000
  alpha: 0.05

aeb:
  initial_k: 3
  step_k: 3
  max_k: 15
  confidence_threshold: 0.70
  stop_on_budget_exhausted: true

retrieval:
  dense_top_k: 50
  sparse_top_k: 50
  rerank_top_k: 15
  final_top_k: 10

verification:
  nli_model: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  entailment_threshold: 0.50
  similarity_threshold: 0.60

calibration:
  method: "temperature_scaling"
  default_temperature: 1.0

triage:
  # Decoupled from AEB confidence_threshold. AEB stops when confidence >= threshold.
  # Triage bands define risk levels based on final confidence.
  # urgent_confidence <= routine_confidence <= home_care_confidence
  urgent_confidence: 0.70    # Confidence < this -> URGENT + ESCALATE
  routine_confidence: 0.85   # Confidence < this -> ROUTINE + ASK_FOLLOWUP
  home_care_confidence: 0.85 # Confidence >= this -> HOME_CARE + ANSWER
  
  # New severity-aware triage parameters (used by triage.py)
  high_confidence: 0.85
  low_confidence: 0.70
  cantmiss_emergency_prob: 0.20  # p >= this for emergent dx -> EMERGENCY
  cantmiss_urgent_prob: 0.05     # p >= this for any can't-miss dx -> >= URGENT
  low_confidence_risk: "ROUTINE" # Acuity when only confidence is low

llm:
  # microsoft/Phi-3.5-mini-instruct: 3.8B parameters, fits comfortably in VRAM, 4x faster execution
  model_name: "microsoft/Phi-3.5-mini-instruct"
  serving_backend: "kaggle_fp16"
  load_in_4bit: false
  bnb_double_quant: false
  max_new_tokens: 256
  temperature: 0.1
  top_p: 0.95

ragas_judge:
  # Fast judge for evaluation
  model_name: "microsoft/Phi-3.5-mini-instruct"

embedding:
  # bge-small-en-v1.5: 90 MB, 384-dim, runs fast on CPU — keeps VRAM free for
  # the LLM. Swap to BAAI/bge-m3 only if you need multilingual / long-context.
  model_name: "BAAI/bge-small-en-v1.5"
  chunk_size: 512
  chunk_overlap: 100

# Hardening security parameters
security:
  upload_requires_role: "admin"
  rate_limit_analyze: [30, 60]      # calls, seconds
  rate_limit_eval: [2, 3600]        # calls, seconds
  external_inference_allowed: false # Blocks HFInferenceReasoner unless data is synthetic
  strict_mode: false                # CAAR_STRICT=1: fail loudly on any fallback
